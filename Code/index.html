<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index</title>
  </head>
  <body>
    <form>
      <table>
        <tr>
          <td><label>First name:</label></td>
          <td><input type="text" placeholder="Enter your first name" /></td>
        </tr>

        <tr>
          <td><label>Last name:</label></td>
          <td><input type="text" placeholder="Enter your last name" /></td>
        </tr>

        <tr>
          <td><label>Date of Birth: </label></td>
          <td><input type="date" /></td>
        </tr>

        <tr>
          <td><label>User name: </label></td>
          <td><input type="text" placeholder="Enter your user name" /></td>
        </tr>

        <tr>
          <td><label>E-mail:</label></td>
          <td><input type="email" placeholder="E-mail" /></td>
        </tr>

        <tr>
          <td><label>Website:</label></td>
          <td><input type="url" placeholder="Enter your website URL" /></td>
        </tr>

        <tr>
          <td><label>Password: </label></td>
          <td><input type="password" placeholder="Enter your password" /></td>
        </tr>

        <tr>
          <td><label>Re-password: </label></td>
          <td><input type="password" placeholder="Conform your password" /></td>
        </tr>

        <tr>
          <td><input type="checkbox" /></td>
          <td><label>I agree to the terms and conditions</label></td>
        </tr>

        <tr>
          <td><input type="button" value="Sign Up" /></td>
        </tr>
      </table>

      <select>
        <option>Select Your City</option>
        <!-- <option><input placeholder="Search for your city"></option> -->
        <option>Peshawar</option>
        <option>Charsadda</option>
        <option>Khyber</option>
        <option>Swat</option>
        <option>Mari</option>
        <option>Kalam</option>
      </select>
    </form>
  </body>
</html>
