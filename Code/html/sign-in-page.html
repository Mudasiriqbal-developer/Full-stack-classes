<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-200 flex justify-center items-center min-h-screen">

<!-- Modal -->
<div class="bg-white w-80 rounded-lg shadow-lg p-6 relative">

    

    <!-- Title -->
    <h2 class="text-center text-2xl font-semibold mb-4">Sign up</h2>

    <!-- Form -->
    <form id="signupForm" class="space-y-3">

        <input type="text" placeholder="First name"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <input type="text" placeholder="Last name"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <input type="email" placeholder="Email"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <input type="date"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <input type="tel" placeholder="Phone number"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <input id="password" type="password" placeholder="Password"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <input id="confirmPassword" type="password" placeholder="Confirm password"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>

        <!-- Error Message -->
        <p id="errorMsg" class="text-red-500 text-sm hidden"></p>

        <!-- Button -->
        <button type="submit"
        class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">
        Sign Up
        </button>

        <p class="text-center text-sm text-gray-500">
            Already have an account?
            <a href="#" class="text-blue-500">Log in</a>
        </p>

    </form>

</div>


<script src="../javascript/sign-in-page.js"></script>

</body>
</html>
